name: Auto Commit

on:
  schedule:
    # Runs every 3 hours (8 times a day) for maximum contribution activity
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: High-Activity Daily Commits
        run: |
          git config --global user.name "TheCyperpunk"
          git config --global user.email "197233485+TheCyperpunk@users.noreply.github.com"
          
          # Generates between 1 and 5 commits per run to produce vibrant green squares
          NUM_COMMITS=$(( (RANDOM % 5) + 1 ))

          MESSAGES=(
            "chore: automated log update"
            "docs: update contribution metrics"
            "style: formatting code and logs"
            "refactor: maintenance tweaks"
            "fix: minor system update"
            "chore: daily activity log"
            "feat: update activity statistics"
            "perf: optimize workflow logs"
          )

          echo "Making $NUM_COMMITS randomized commit(s)..."

          for (( i=1; i<=NUM_COMMITS; i++ )); do
            # Pick a random commit message
            RAND_INDEX=$((RANDOM % ${#MESSAGES[@]}))
            RANDOM_MSG="${MESSAGES[$RAND_INDEX]}"
            
            # Append current timestamp to commit-log.txt
            echo "Activity logged at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> commit-log.txt
            
            git add commit-log.txt
            git commit -m "$RANDOM_MSG" || true
            sleep 2
          done

          git push

