name: Unlock GitHub Achievements

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      discussions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Trigger Galaxy Brain (Discussions Q&A)
        env:
          PAT: ${{ secrets.AUTO_FORK_PAT }}
        run: |
          python scripts/galaxy_brain.py

      - name: Trigger Quickdraw Achievement
        env:
          PAT: ${{ secrets.AUTO_FORK_PAT }}
        run: |
          TOKEN="${PAT:-$GITHUB_TOKEN}"
          echo "Creating issue for Quickdraw..."
          ISSUE_RESP=$(curl -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d '{"title":"⚡ Quickdraw Achievement Trigger","body":"Automated issue closed within 5 minutes for achievement."}')
          
          ISSUE_NUM=$(echo "$ISSUE_RESP" | jq -r '.number')
          echo "Issue response: $ISSUE_RESP"
          
          if [ "$ISSUE_NUM" != "null" ] && [ -n "$ISSUE_NUM" ]; then
            echo "Waiting 5 seconds before closing..."
            sleep 5
            echo "Closing issue #$ISSUE_NUM..."
            CLOSE_RESP=$(curl -s -X PATCH \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM \
              -d '{"state":"closed","state_reason":"completed"}')
            echo "Close response: $CLOSE_RESP"
            echo "Successfully closed issue #$ISSUE_NUM within 5 minutes!"
          else
            echo "Failed to create issue."
          fi

      - name: Trigger Pull Shark & Pair Extraordinaire
        env:
          PAT: ${{ secrets.AUTO_FORK_PAT }}
        run: |
          TOKEN="${PAT:-$GITHUB_TOKEN}"
          BRANCH_NAME="achievement-boost-$(date +%s)"
          
          git config user.name "Sibin P"
          git config user.email "putharamannilshibin@gmail.com"
          
          git checkout -b "$BRANCH_NAME"
          echo "Achievement boost commit at $(date -u)" >> commit-log.txt
          git add commit-log.txt
          
          git commit -m "feat: level up pull shark and pair extraordinaire

          Co-authored-by: TheCyperpunk <197233485+TheCyperpunk@users.noreply.github.com>"
          
          git push origin "$BRANCH_NAME"
          
          echo "Creating pull request..."
          PR_RESP=$(curl -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d "{\"title\":\"feat: achievement boost\",\"head\":\"$BRANCH_NAME\",\"base\":\"main\",\"body\":\"Automated PR for achievements.\"}")
          
          PR_NUM=$(echo "$PR_RESP" | jq -r '.number')
          echo "Created PR #$PR_NUM"
          
          if [ "$PR_NUM" != "null" ] && [ -n "$PR_NUM" ]; then
            sleep 3
            echo "Merging PR #$PR_NUM..."
            curl -s -X PUT \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUM/merge \
              -d '{"merge_method":"merge"}'
            echo "PR #$PR_NUM merged successfully!"
          fi
